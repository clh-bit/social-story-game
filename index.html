<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>社交故事練習</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#142c49;background:#eff4fc}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1100px;margin:auto;background:white;border:1px solid #ccd8eb;border-radius:24px;padding:clamp(16px,4vw,32px);box-shadow:0 16px 45px #18375c15}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:clamp(24px,4vw,32px);margin:0}p{line-height:1.7}.muted{color:#52667e}.badge{background:#e3eeff;padding:8px 14px;border-radius:24px;white-space:nowrap}progress{width:100%;height:12px;margin:22px 0;accent-color:#2563eb}h2{font-size:22px}#view{outline:none}.panel{max-width:740px;margin:16px auto}.panel img{display:block;width:100%;height:auto;border-radius:16px;border:2px solid #c3d0e5}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}.card{border:2px solid #c3d0e5;border-radius:16px;padding:10px;background:#f8fbff;animation:enter .4s both}.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card img{width:100%;height:auto;display:block;border-radius:9px}.card button{width:100%;margin-top:12px}.card:hover{border-color:#2563eb;transform:translateY(-3px)}button{font:inherit;font-weight:700;border-radius:12px;padding:13px 20px;min-height:48px;cursor:pointer;background:#245bd6;color:white;border:2px solid #245bd6;transition:transform .18s,background .18s}button:hover{background:#1746ac}button:focus-visible{outline:4px solid #e2a51c;outline-offset:3px}button:disabled{opacity:.45;cursor:wait}.secondary{background:white;color:#23446d;border-color:#a8b9d2}.secondary:hover{background:#edf3fc}nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.feedback{background:#eef6ff;border-left:5px solid #2563eb;border-radius:12px;padding:16px;line-height:1.8}.error{background:#fff0f0;border:1px solid #d53636;border-radius:12px;padding:16px;white-space:pre-wrap}#status{min-height:24px;color:#52667e}.animate{animation:enter .4s both}[hidden]{display:none!important}dialog{max-width:95vw;max-height:95vh;border:0;border-radius:16px;padding:16px}dialog img{display:block;max-width:85vw;max-height:78vh;object-fit:contain;margin-bottom:12px}dialog::backdrop{background:#0d203bc9}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@media(max-width:650px){body{padding:8px}.choices{grid-template-columns:1fr}.card{max-width:440px;width:100%;margin:auto}header{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;transform:none!important}}
</style>
<script src="./app.js" defer></script>
</head>
<body><main>
<header><div><h1>社交故事練習</h1><p class="muted">逐格看故事，練習表達感受與界線。</p></div><span id="badge" class="badge"></span></header>
<progress id="progress" max="15" value="1" aria-label="練習進度"></progress>
<section id="view" tabindex="-1" aria-labelledby="heading"><h2 id="heading"></h2><p id="instruction"></p><div id="content"></div></section>
<p id="status" role="status" aria-live="polite"></p>
<nav aria-label="遊戲控制"><button id="back" class="secondary">上一步</button><button id="next">下一步</button><button id="restart" class="secondary">重新開始</button></nav>
<noscript>請啟用 JavaScript，才能使用這個遊戲。</noscript>
</main>
<dialog id="zoom"><img id="zoomImage" alt="放大漫畫"><button id="closeZoom">關閉</button></dialog>
</body></html>
